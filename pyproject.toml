[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-eval-kit"
version = "0.0.1"
description = "Measure and fix RAG assistants: retrieval and answer-quality evals with before/after numbers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastembed==0.9.1",
    "numpy>=1.26",
    "rank-bm25==0.2.2",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
rag_eval_kit = ["*.js"]
